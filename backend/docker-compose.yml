x-vault-env: &vault-env
  VAULT_ADDR: http://vault:8200
  VAULT_TOKEN: votiix-dev-root-token


services:
  # ==========================================
  # 1. API GATEWAY (THE FRONT DOOR)
  # ==========================================
  krakend:
    image: krakend:latest
    ports:
      - "8080:8080"
    volumes:
      - ./krakend:/etc/krakend
    command: ["run", "-c", "/etc/krakend/krakend.json"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/__health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    depends_on:
      - votiix-identity
      - votiix-token
      - votiix-vote-engine
      - votiix-core
      - votiix-iot
      - votiix-observer
      - votiix-messenger
      - votiix-hardware

  # ==========================================
  # 2. SECRETS MANAGEMENT
  # ==========================================
  vault:
    image: hashicorp/vault:latest
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: votiix-dev-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    volumes:
      - vault_data:/vault/file

  vault-init:
    image: hashicorp/vault:latest
    depends_on:
      - vault
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: votiix-dev-root-token
    volumes:
      - ./vault/init.sh:/init.sh:ro
    entrypoint: /bin/sh
    command: /init.sh
    restart: "no"

  # ==========================================
  # 3. DATABASES & PERSISTENCE
  # ==========================================
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: votiix
      POSTGRES_PASSWORD: votiix_password
      POSTGRES_DB: ballot_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data

  # ==========================================
  # 4. MESSAGING (KAFKA - KRaft Mode)
  # ==========================================
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:9092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:29092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "29092:29092"




  # ==========================================
  # 6. VOTIIX MICROSERVICES
  # ==========================================
  votiix-identity:
    build:
      context: .
      dockerfile: apps/votiix-identity/Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    depends_on:
      vault-init:
        condition: service_completed_successfully
      postgres:
        condition: service_started
      redis:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - default
      - esignet-mock
    environment:
      <<: *vault-env
      PORT: 3000
      ESIGNET_URL: http://esignet:8088
      MOCK_IDENTITY_URL: http://mock-identity-system:8082

  votiix-token:
    build:
      context: .
      dockerfile: apps/votiix-token/Dockerfile
    restart: unless-stopped
    depends_on:
      vault-init:
        condition: service_completed_successfully
      postgres:
        condition: service_started
      redis:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - default
      - esignet-mock
    environment:
      <<: *vault-env
      PORT: 3001
      ESIGNET_URL: http://esignet:8088

  votiix-vote-engine:
    build:
      context: .
      dockerfile: apps/votiix-vote-engine/Dockerfile
    restart: unless-stopped
    depends_on:
      vault-init:
        condition: service_completed_successfully
      postgres:
        condition: service_started
      redis:
        condition: service_started
      kafka:
        condition: service_started
    environment:
      <<: *vault-env
      PORT: 3002

  votiix-core:
    build:
      context: .
      dockerfile: apps/votiix-core/Dockerfile
    restart: unless-stopped
    environment:
      <<: *vault-env
      PORT: 3003
    depends_on:
      vault-init:
        condition: service_completed_successfully
      postgres:
        condition: service_started
      redis:
        condition: service_started
      kafka:
        condition: service_started
      minio:
        condition: service_started

  votiix-iot:
    build:
      context: .
      dockerfile: apps/votiix-iot/Dockerfile
    restart: unless-stopped
    depends_on:
      vault-init:
        condition: service_completed_successfully
      postgres:
        condition: service_started
      redis:
        condition: service_started
      kafka:
        condition: service_started
    environment:
      <<: *vault-env
      PORT: 3004

  votiix-observer:
    build:
      context: .
      dockerfile: apps/votiix-observer/Dockerfile
    restart: unless-stopped
    environment:
      <<: *vault-env
      PORT: 3005
    depends_on:
      vault-init:
        condition: service_completed_successfully
      mongo:
        condition: service_started
      kafka:
        condition: service_started

  votiix-messenger:
    build:
      context: .
      dockerfile: apps/votiix-messenger/Dockerfile
    restart: unless-stopped
    depends_on:
      vault-init:
        condition: service_completed_successfully
      postgres:
        condition: service_started
      redis:
        condition: service_started
      kafka:
        condition: service_started
    environment:
      <<: *vault-env
      PORT: 3006

  # ==========================================
  # 6b. HARDWARE BACKEND (Omar's ESP32 API)
  # ==========================================
  votiix-hardware:
    build:
      context: ..
      dockerfile: Dockerfile.hardware
    restart: unless-stopped
    ports:
      - "3007:3007"
    depends_on:
      postgres:
        condition: service_started
    environment:
      PORT: 3007
      DB_USER: votiix
      DB_HOST: postgres
      DB_NAME: ballot_db
      DB_PASSWORD: votiix_password
      DB_PORT: 5432

  # ==========================================
  # 7. OBSERVABILITY (PLG Stack)
  # ==========================================
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml

  promtail:
    image: grafana/promtail:latest
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3200:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

volumes:
  vault_data:
  postgres_data:
  redis_data:
  mongo_data:
  minio_data:
  prometheus_data:
  loki_data:
  grafana_data:

networks:
  default:
    name: apiserver_default
  esignet-mock:
    external: true
    name: esignet-mock_default

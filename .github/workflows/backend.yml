name: MOSIP Tests

on:
  push:
    paths:
      - 'backend/**'
      - 'esignet-mock/**'
    branches: [ backend ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Build Shared Packages
        working-directory: ./backend
        run: |
          npm ci
          npm run build --workspaces --if-present

      - name: Start eSignet Mock Services
        working-directory: ./backend/esignet-mock
        run: docker compose up --build -d

      - name: Start Votiix Backend Services
        working-directory: ./backend
        run: docker compose up --build -d

      - name: Wait for Services
        run: |
          echo "Waiting for eSignet Backend (localhost:8088)..."
          timeout 120 bash -c 'until curl -sf http://localhost:8088/v1/esignet/swagger-ui.html; do sleep 5; done'

          echo "Waiting for Mock Identity System (localhost:8082)..."
          timeout 120 bash -c 'until curl -sf http://localhost:8082/v1/mockidentitysystem/swagger-ui.html; do sleep 5; done'

          echo "Waiting for KrakenD Gateway (localhost:8080)..."
          timeout 120 bash -c 'until curl -sf http://localhost:8080/__health; do sleep 5; done'

          echo "All services are up!"

      - name: Dump Docker Logs on Failure
        if: failure()
        run: |
          cd ./backend/esignet-mock && docker compose logs
          cd ./backend && docker compose logs

      - name: Install Newman CLI
        run: npm install -g newman newman-reporter-htmlextra

      - name: Run API Tests with Postman
        run: |
          mkdir -p test-results
          newman run tests/votiix-api.postman_collection.json -r cli,htmlextra --reporter-htmlextra-export test-results/postman-results.html

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-test-results
          path: test-results/postman-results.html

      - name: Stop Services
        if: always()
        run: |
          docker compose -f ./backend/docker-compose.yml down || true
          docker compose -f ./backend/esignet-mock/docker-compose.yml down || true

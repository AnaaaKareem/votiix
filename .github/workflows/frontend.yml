name: Frontend CI Pipeline

on:
  push:
    branches: [ "frontend" ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [ "frontend" ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

jobs:
  build-admin-dashboard:
    name: Build Admin Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend/admin_dashboard

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: './frontend/admin_dashboard/package-lock.json'

    - name: Install dependencies
      run: npm ci

    - name: Lint code
      run: npm run lint

    - name: Build project
      run: npm run build

    - name: Upload Admin Dashboard Build
      uses: actions/upload-artifact@v4
      with:
        name: admin-dashboard-build
        path: ./frontend/admin_dashboard/dist
        retention-days: 14

  build-voters-interface:
    name: Build Voters Interface
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend/voters_interface

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: './frontend/voters_interface/package-lock.json'

    - name: Install dependencies
      run: npm ci

    - name: Lint code
      run: npm run lint

    - name: Build project
      run: npm run build

    - name: Upload Voters Interface Build
      uses: actions/upload-artifact@v4
      with:
        name: voters-interface-build
        path: ./frontend/voters_interface/dist
        retention-days: 14

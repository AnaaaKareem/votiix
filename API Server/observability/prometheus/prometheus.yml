global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'votiix-identity'
    static_configs:
      - targets: ['votiix-identity:3000']
    metrics_path: /metrics

  - job_name: 'votiix-token'
    static_configs:
      - targets: ['votiix-token:3001']
    metrics_path: /metrics

  - job_name: 'votiix-vote-engine'
    static_configs:
      - targets: ['votiix-vote-engine:3002']
    metrics_path: /metrics

  - job_name: 'votiix-core'
    static_configs:
      - targets: ['votiix-core:3003']
    metrics_path: /metrics

  - job_name: 'votiix-iot'
    static_configs:
      - targets: ['votiix-iot:3004']
    metrics_path: /metrics

  - job_name: 'votiix-observer'
    static_configs:
      - targets: ['votiix-observer:3005']
    metrics_path: /metrics

  - job_name: 'votiix-messenger'
    static_configs:
      - targets: ['votiix-messenger:3006']
    metrics_path: /metrics
